name: create-v0.1.0-tag
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-v0.1.0-tag.yml'
  workflow_dispatch:
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create lightweight tag v0.1.0 on approved release commit
        env:
          TARGET: ddecc521c33d594f63c07aa0e6092790d6f7a760
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v0.1.0 >/dev/null; then
            existing=$(git rev-list -n1 v0.1.0)
            echo "tag already exists at $existing"
            test "$existing" = "$TARGET"
            exit 0
          fi
          git rev-parse --verify "$TARGET^{commit}"
          git tag v0.1.0 "$TARGET"
          git push origin v0.1.0
          git rev-list -n1 v0.1.0
